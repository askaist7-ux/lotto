<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로또 번호 뽑기</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 4vw, 3rem);
      background: #edf3ff;
      color: #17254a;
      font: 1.25rem/1.5 system-ui, sans-serif;
    }

    main {
      width: min(100%, 50rem);
      padding: clamp(1rem, 5vw, 3.5rem);
      border: 1px solid #c7d5ed;
      border-radius: 1.5rem;
      background: #fff;
      box-shadow: 0 1rem 3rem #17254a15;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.2;
    }

    .instructions { margin: 0.85rem 0 0; }

    .balls {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: clamp(0.45rem, 2vw, 1rem);
      margin: 2rem auto 1.5rem;
      max-width: 42rem;
    }

    .ball {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 33% 25%, #ffffff80, transparent 60%), var(--color);
      box-shadow: inset 0 -0.3rem 0 #17254a20;
      color: #172033;
      font-size: clamp(1.6rem, 6vw, 3.25rem);
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .ball:nth-child(1) { --color: #ffd052; }
    .ball:nth-child(2) { --color: #79c5ff; }
    .ball:nth-child(3) { --color: #ff8989; }
    .ball:nth-child(4) { --color: #87d5a2; }
    .ball:nth-child(5) { --color: #c5a8f5; }
    .ball:nth-child(6) { --color: #ffac68; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      max-width: 34rem;
      margin-inline: auto;
    }

    button {
      min-height: 4.5rem;
      padding: 0.65rem 0.8rem;
      border: 3px solid #233f96;
      border-radius: 0.85rem;
      background: #233f96;
      color: #fff;
      font: inherit;
      font-size: clamp(1.35rem, 4vw, 1.9rem);
      font-weight: 750;
      cursor: pointer;
    }

    button:where(#redraw) { background: #fff; color: #233f96; }
    button:focus-visible { outline: 3px solid #17254a; outline-offset: 4px; }
    button[aria-disabled="true"] {
      border-color: #64718a;
      background: #edf1f8;
      color: #3f4e68;
      cursor: default;
    }

    #status { min-height: 1.5em; margin: 1rem 0 0; }

    @media (max-width: 38rem) {
      .balls { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 21rem; }
    }

    @media (max-width: 27rem) {
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>로또 번호 뽑기</h1>
    <p class="instructions">1부터 45까지, 겹치지 않는 숫자 6개를 뽑아요.</p>

    <div class="balls" aria-hidden="true">
      <span class="ball">?</span>
      <span class="ball">?</span>
      <span class="ball">?</span>
      <span class="ball">?</span>
      <span class="ball">?</span>
      <span class="ball">?</span>
    </div>

    <div class="actions">
      <button id="draw" type="button">번호 뽑기</button>
      <button id="redraw" type="button" aria-disabled="true">다시 뽑기</button>
    </div>
    <p id="status" role="status" aria-atomic="true">‘번호 뽑기’ 버튼을 눌러 주세요.</p>
  </main>

  <script>
    const balls = document.querySelectorAll(".ball");
    const drawButton = document.querySelector("#draw");
    const redrawButton = document.querySelector("#redraw");
    const statusMessage = document.querySelector("#status");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    function pickNumbers() {
      const numbers = new Set();

      while (numbers.size < balls.length) {
        numbers.add(Math.floor(Math.random() * 45) + 1);
      }

      return [...numbers];
    }

    function showNumbers(numbers) {
      balls.forEach((ball, index) => {
        ball.textContent = numbers[index];
      });
    }

    function draw(event) {
      if (event.currentTarget.getAttribute("aria-disabled") === "true") return;

      const result = pickNumbers().sort((a, b) => a - b);
      drawButton.setAttribute("aria-disabled", "true");
      redrawButton.setAttribute("aria-disabled", "true");

      function finish() {
        showNumbers(result);
        statusMessage.textContent = "추첨 결과 " + result.join(", ");
        drawButton.removeAttribute("aria-disabled");
        redrawButton.removeAttribute("aria-disabled");
      }

      if (reduceMotion.matches) {
        finish();
        return;
      }

      statusMessage.textContent = "번호를 뽑고 있어요…";
      showNumbers(pickNumbers());
      const animation = setInterval(() => showNumbers(pickNumbers()), 75);

      setTimeout(() => {
        clearInterval(animation);
        finish();
      }, 900);
    }

    drawButton.addEventListener("click", draw);
    redrawButton.addEventListener("click", draw);
  </script>
</body>
</html>
